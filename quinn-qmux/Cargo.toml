[package]
name = "quinn-qmux"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "QMux (QUIC multiplexing over reliable transports) built on the quinn-proto stream state machine"
keywords = ["quic", "qmux", "multiplexing"]
categories.workspace = true
workspace = ".."
# Depends on quinn-proto's private `unstable-qmux` feature; not ready for crates.io
publish = false

[features]
default = ["runtime-tokio"]
runtime-tokio = ["dep:tokio", "dep:rustc-hash"]

[dependencies]
bytes = { workspace = true }
quinn-proto = { path = "../quinn-proto", version = "0.12", default-features = false, features = ["unstable-qmux"] }
rustc-hash = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "io-util", "macros"], optional = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "time", "io-util", "macros", "rt-multi-thread"] }
