[package]
name = "quinn-qmux"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tokio runtime for QMux (QUIC multiplexing over reliable transports) via quinn-proto"
keywords = ["quic", "qmux", "multiplexing"]
categories.workspace = true
workspace = ".."
publish = false

[dependencies]
bytes = { workspace = true }
quinn-proto = { path = "../quinn-proto", version = "0.12", default-features = false }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "io-util", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "time", "io-util", "macros", "rt-multi-thread", "net"] }
